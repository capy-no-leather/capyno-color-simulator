<style>
  /* この商品（二つ折りパスケース）のアートワーク専用スタイル。
     色変数の初期値と、SVGパーツ⇔色変数の対応はここに書く。 */
  :root{
    --main-color:#9E695F;
    --main-suede-color:#68413D;
    --inner-color:#B5B07D;
    --thread-color:#C7D08B;
    --hardware:#C9A227;
    --main-border:#754A43;
    --inner-border:#8F8A5D;
  }
  .c-main{ fill:var(--main-color); stroke:var(--main-border); stroke-miterlimit:10; stroke-width:.5px; transition:fill .35s ease, stroke .35s ease; }
  .c-main-suede{ fill:var(--main-suede-color); stroke:var(--main-border); stroke-miterlimit:10; stroke-width:.5px; transition:fill .35s ease, stroke .35s ease; }
  .c-inner{ fill:var(--inner-color); stroke:var(--inner-border); stroke-miterlimit:10; stroke-width:.5px; transition:fill .35s ease, stroke .35s ease; }
  .c-thread{ fill:none; stroke:var(--thread-color); stroke-dasharray:5 8; stroke-width:2px; stroke-linecap:round; transition:stroke .35s ease; }
  .c-hardware{ fill:#fff; stroke:#c9a227; stroke-width:4px; }
</style>
