    --main-color:#48769D;
    --main-suede-color:#527994;
    --inner-color:#FF9BAD;
    --thread-color:#FFCCD7;
    --hardware:#C9A227;
    --main-border:#365A78;
    --inner-border:#D96F86;
  }

  .c-main-suede{ fill:var(--main-suede-color); stroke:var(--main-border); stroke-miterlimit:10; stroke-width:.5px; transition:fill .35s ease, stroke .35s ease; }

  .c-thread{ fill:none; stroke:var(--thread-color); stroke-dasharray:5 8; stroke-width:2px; stroke-linecap:round; transition:stroke .35s ease; }
  .c-hardware-fill{ fill:#c9a227; }
  .c-hardware-fill2{ fill:#c9a227; }
  .c-hardware-fill3{ fill:#c9a227; stroke:rgba(165,135,86,.5); stroke-linejoin:round; stroke-linecap:round; }
