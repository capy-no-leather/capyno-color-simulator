<style>
  /* この商品（パスケース）のアートワーク専用スタイル。
     色変数の初期値と、SVGパーツ⇔色変数の対応はここに書く。
     ステッチカラーは独立選択させず、メインカラーの linked から
     --thread-color に自動で流し込まれる。 */
  :root{
    --main-color:#FF9BAD;
    --main-border:#D96F86;
    --base-color:#48769D;
    --base-border:#365A78;
    --thread-color:#FFCCD7;
  }
  .c-main{ fill:var(--main-color); stroke:var(--main-border); stroke-miterlimit:10; stroke-width:.5px; transition:fill .35s ease, stroke .35s ease; }
  .c-base{ fill:var(--base-color); stroke:var(--base-border); stroke-miterlimit:10; stroke-width:.5px; transition:fill .35s ease, stroke .35s ease; }
  .c-thread{ fill:none; stroke:var(--thread-color); stroke-dasharray:5 8; stroke-width:2px; stroke-linecap:round; transition:stroke .35s ease; }
  .c-hardware{ fill:#fff; stroke:#c9a227; stroke-width:4px; }
</style>
</head>

        <rect class="c-thread" x="8.75" y="8.75" width="294.8" height="181.42" rx="14.17" ry="14.17" transform="translate(312.31 198.93) rotate(180)"/>
        <rect class="c-base" x=".25" y="260.88" width="311.81" height="198.43" rx="14.17" ry="14.17" transform="translate(516.24 203.93) rotate(90)"/>
        <circle class="c-hardware" cx="77.37" cy="225.61" r="9.92"/>
